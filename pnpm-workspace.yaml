packages:
  - packages/*
  - apps/web
  - apps/collab
  - apps/cli
  - apps/sites
  - apps/mobile

# Install scripts are denied by default (pnpm 10). Only the build toolchain's
# native-binary packages are allowed to run one: esbuild links the platform
# binary Vite/Vitest execute, and @parcel/watcher compiles the native watcher
# Storybook's dev server uses. lefthook's installs the git hooks
# in lefthook.yml.
onlyBuiltDependencies:
  - esbuild
  - '@parcel/watcher'
  - lefthook

# Transitive advisories (excalidraw/mermaid pin old patch levels); same major only.
overrides:
  'nanoid@<3.3.18': '^3.3.18'
  'lodash-es@<4.18.0': '^4.18.0'
  'source-map-js@<1.2.2': '^1.2.2'
