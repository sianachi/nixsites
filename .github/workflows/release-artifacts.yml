# Release artifacts: the same build as the images, as plain files on the GitHub release, for
# projects that run Nix without containers (a desktop bundle, a packaged install).
#
#   nix-web-<tag>.tar.gz          the built web app (static files; serve with an SPA fallback)
#   nix-core-<tag>-<rid>.tar.gz   Core (Nix.Api) and the migrator (Nix.Migrator), self-contained: no .NET install
#   nix-node-<tag>.tar.gz         collaboration, companion and sites worker with production dependencies
#   nix-sync-core-<version>.tgz   npm tarballs, installable by URL
#   nix-api-client-<version>.tgz
#
# Runs when a release is published, so the release exists to attach to. Dispatch by hand with a
# tag to rebuild the files of an existing release.
name: Release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release (vX.Y.Z)
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  node:
    name: Web app, node services and packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # The root "prepare" builds every package the services and the web app import.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: scripts/release-artifacts.sh node "$TAG" "$RUNNER_TEMP/artifacts"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/artifacts/* --clobber

  core:
    name: Core for ${{ matrix.rid }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, osx-arm64, win-x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: scripts/release-artifacts.sh core "$TAG" "$RUNNER_TEMP/artifacts" "${{ matrix.rid }}"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/artifacts/* --clobber
