# Backend CI (engineering plan section 9.2).
#   Everything runs side by side so a run costs the slowest job, not the sum of the stages:
#   format, static, unit, and the integration suite split into shards (below).
#
# Split from the frontend workflow so the two lanes can be developed in
# parallel without contending for one file. Path filters mean a frontend-only
# change does not queue a .NET toolchain run, and vice versa. Files shared by
# both lanes (the guard scripts, the workflows themselves) trigger both.
#
# Nix.slnx sits at the repository root rather than under backend/ so that one
# IDE window covers both lanes. That puts it, and the Nix.Frontend browse
# project it carries, outside the backend/** filter, so both are listed on
# their own below; the steps that name the solution run from the checkout root
# while the per-project steps still run from backend/.
name: CI backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'Nix.slnx'
      - 'Nix.Frontend/**'
      - 'scripts/check-byte-array-markers.sh'
      - 'scripts/check-no-controllers.sh'
      - 'scripts/check-layering.sh'
      - 'scripts/check-root-is-unambiguous.sh'
      - 'scripts/fetch-pdf-fonts.sh'
      - 'scripts/ci/integration-*'
      - 'scripts/ci/check-shard-partition.mjs'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'Nix.slnx'
      - 'Nix.Frontend/**'
      - 'scripts/check-byte-array-markers.sh'
      - 'scripts/check-no-controllers.sh'
      - 'scripts/check-layering.sh'
      - 'scripts/check-root-is-unambiguous.sh'
      - 'scripts/fetch-pdf-fonts.sh'
      - 'scripts/ci/integration-*'
      - 'scripts/ci/check-shard-partition.mjs'
      - '.github/workflows/ci-backend.yml'

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # dotnet format loads and analyses the whole solution, which is the slow part (about four
  # minutes), so it gets a runner of its own instead of delaying the build.
  backend-format:
    name: backend format
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          # mise.toml pins dotnet = "10"; track the same major here.
          dotnet-version: 10.0.x

      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Packages.props', 'Nix.slnx') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Verify formatting (dotnet format)
        run: dotnet format Nix.slnx --verify-no-changes

  # Build once with the analyzers and warnings-as-errors on, then run the unit suite on that
  # build. It used to build a second time in its own job.
  backend-static:
    name: backend static
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Packages.props', 'Nix.slnx') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build (analyzers + warnings-as-errors)
        run: dotnet build Nix.slnx --configuration Release -p:NixGenerateOpenApiContract=true

      # The build above regenerates backend/openapi/nix-api.json (see the OpenAPI
      # section of Nix.Api.csproj). If the committed contract no longer matches the
      # code, the generated frontend client is stale - fail here rather than at
      # runtime. Fix by rebuilding locally and committing the regenerated file.
      #
      # This is also the seam between the two development lanes: the frontend
      # generates its types from this artifact, so it must never drift.
      - name: OpenAPI contract is committed and current
        run: git diff --exit-code -- backend/openapi

      - name: Byte-array marker guard (memory rule 7)
        run: ./scripts/check-byte-array-markers.sh

      - name: No-controllers guard (minimal APIs only, section 2.3)
        run: ./scripts/check-no-controllers.sh

      # Replaces the three DependencyDirectionTests that the single-project
      # collapse made unexpressible. Weaker than an assembly-reference check and
      # deliberately so; see ADR-0015 for what it does and does not catch.
      - name: Layering guard (Domain/ carries no infrastructure, ADR-0015)
        run: ./scripts/check-layering.sh

      # Cheap to reintroduce, expensive to diagnose: a second project or solution
      # file at the root makes every bare dotnet command fail with MSB1011, and
      # the fixes that look obvious (global.json, Directory.Build.rsp, a rename)
      # all fail differently. See the script header.
      - name: Root has exactly one project/solution file
        run: ./scripts/check-root-is-unambiguous.sh

  # The unit suite on its own build. The analyzers and warnings-as-errors already gate the same
  # sources in backend-static, so this build leaves the analyzers out: the binaries are the same
  # and it saves about half the compile time.
  #
  # Named explicitly rather than run across the solution: Nix.Integration.Tests needs Docker and
  # runs in its own shard jobs. Nix.Tests must stay free of Testcontainers so this job never needs
  # a daemon - that is the whole reason the two suites are separate projects rather than one.
  backend-unit:
    name: backend unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Packages.props', 'Nix.slnx') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build backend/tests/Nix.Tests/Nix.Tests.csproj --configuration Release -p:RunAnalyzers=false

      # The PDF CJK font tests skip without these fonts.
      - name: Fetch PDF fallback fonts
        run: sh scripts/fetch-pdf-fonts.sh

      - name: Unit tests
        working-directory: backend
        run: dotnet test --project tests/Nix.Tests/Nix.Tests.csproj --configuration Release --no-build

  # ── Integration ────────────────────────────────────────────────────────────
  # Everything that needs a real Postgres: the tenant isolation policies, the
  # composite foreign keys that stop cross-tenant references, the grants matrix,
  # the pre-authentication identity provider resolver, and the SET LOCAL pooling
  # proof. These are the tests the engineering plan calls the crown jewels, and a
  # permission regression is a breach rather than a defect, so "someone ran it
  # locally" is not a control.
  #
  # One suite, run as eight shards that each build the test project and run a slice of the
  # classes (scripts/ci/integration-shard.mjs; the slice lists are in
  # scripts/ci/integration-shards.json). A pull request skips the plan-evidence classes, as it
  # always did: they measure query plans over a large seeded corpus, take minutes, and run on
  # every push to main. backend-shard-guard proves the slices together are the whole suite.
  backend-integration:
    name: backend integration (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      SKIP_PLAN_EVIDENCE: '' # MEASURE: restore the pull_request condition
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Packages.props', 'Nix.slnx') }}
          restore-keys: nuget-${{ runner.os }}-

      # No docker setup step: ubuntu-24.04 ships a running daemon, and
      # Testcontainers finds it through the default socket. Asserted rather than
      # assumed, because the failure mode otherwise is a confusing timeout deep
      # inside the fixture rather than a clear message here.
      - name: Docker is available for Testcontainers
        run: docker info --format 'docker {{.ServerVersion}}'

      # The analyzers run in backend-static over the same sources, so this build leaves them out. The
      # Postgres image downloads while the compiler runs. Pulled explicitly rather than inside
      # the fixture, where it would land in the first test's timeout budget and present as a flake
      # on a cold runner.
      - name: Build, and pre-pull the Postgres image
        run: |
          docker pull pgvector/pgvector:pg16 &
          pull=$!
          dotnet build backend/tests/Nix.Integration.Tests/Nix.Integration.Tests.csproj --configuration Release -p:RunAnalyzers=false
          wait "$pull"

      # What this shard would run, and what the whole suite is, for backend-shard-guard.
      - name: List this shard's tests
        run: |
          mkdir -p shard-lists
          LIST=1 bash scripts/ci/integration-tests.sh ${{ matrix.shard }} > shard-lists/shard-${{ matrix.shard }}.txt
          if [ "${{ matrix.shard }}" = 1 ]; then LIST=1 bash scripts/ci/integration-tests.sh all > shard-lists/all.txt; fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shard-list-${{ matrix.shard }}
          path: shard-lists/

      - name: Integration tests (shard ${{ matrix.shard }} of 8)
        timeout-minutes: 20
        run: |
          # Only inspect disposable Testcontainers databases on this runner.
          # Report long-running statements so fixture stalls have server-side evidence.
          (
            while sleep 15; do
              for container in $(docker ps -q --filter label=org.testcontainers=true --filter ancestor=pgvector/pgvector:pg16); do
                docker exec "$container" psql -U postgres -d postgres -Atc "SELECT pid, wait_event_type, wait_event, now() - query_start AS elapsed, pg_blocking_pids(pid), left(query, 500) FROM pg_stat_activity WHERE state = 'active' AND pid <> pg_backend_pid() AND query_start < now() - interval '15 seconds';" || true
              done
            done
          ) &
          diagnostic_pid=$!
          trap 'kill "$diagnostic_pid" 2>/dev/null || true' EXIT
          # The step timeout bounds a stuck test; the hang dump flags need an extension package xunit v4 does not bundle.
          bash scripts/ci/integration-tests.sh ${{ matrix.shard }}

  # The shards are slices of one suite. Each listed its tests before running them; the unsplit
  # listing came from shard 1. Fails if a test is in no shard, in two, or is not in the suite.
  backend-shard-guard:
    name: backend shard guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: backend-integration
    if: always() && needs.backend-integration.result != 'cancelled'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: shard-list-*
          path: lists
          merge-multiple: true

      - name: Shards are a partition of the suite
        run: |
          node scripts/ci/integration-shard.mjs --check
          node scripts/ci/check-shard-partition.mjs lists
