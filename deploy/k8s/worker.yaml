# Rendered with envsubst by deploy/k8s/deploy.sh - needs $REGISTRY, $TAG.
#
# The pet companion (codex app-server) behind the internal HTTP API, from the CI-published
# worker image, until it moves into the Node process. Every job role runs inside Core
# (backend/src/Nix.Workers); this pod holds no broker, database or storage credential.
apiVersion: v1
kind: Service
metadata: { name: nix-worker, namespace: nix }
spec:
  selector: { app: nix-worker }
  ports: [{ port: 8301, targetPort: 8301 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: nix-worker, namespace: nix }
spec:
  replicas: 1
  selector: { matchLabels: { app: nix-worker } }
  template:
    metadata:
      labels: { app: nix-worker }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: ${REGISTRY}/worker:${TAG}
          ports: [{ containerPort: 8301 }]
          env:
            # The release this pod runs, shown in Settings > About (deploy/k8s/deploy.sh sets both).
            - name: NIX_RELEASE_VERSION
              value: "${NIX_RELEASE_VERSION}"
            - name: NIX_RELEASE_COMMIT
              value: "${TAG}"
            - name: TMPDIR
              value: /tmp
            - name: NIX_COMPANION_DATA_DIR
              value: /var/lib/nix-worker/companion
            - name: NIX_WORKER_INTERNAL_SECRET
              valueFrom: { secretKeyRef: { name: nix-internal, key: secret } }
            - name: NIX_WORKER_API_URL
              value: http://nix-api:8080
          livenessProbe: { httpGet: { path: /healthz, port: 8301 }, periodSeconds: 10 }
          readinessProbe: { httpGet: { path: /readyz, port: 8301 }, periodSeconds: 5 }
          resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { cpu: "1", memory: 512Mi } }
          volumeMounts:
            - { name: staging, mountPath: /tmp }
            - { name: companion, mountPath: /var/lib/nix-worker/companion }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
      volumes:
        - { name: staging, emptyDir: { sizeLimit: 64Mi } }
        - { name: companion, emptyDir: { sizeLimit: 256Mi } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: worker-egress, namespace: nix }
spec:
  podSelector: { matchLabels: { app: nix-worker } }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: nix-api } } }]
      ports: [{ protocol: TCP, port: 8080 }]
    - ports: [{ protocol: TCP, port: 443 }]
    - ports: [{ protocol: UDP, port: 53 }]
