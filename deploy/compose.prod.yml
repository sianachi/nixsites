name: nix

services:
  nix-versitygw:
    image: versity/versitygw:v1.7.0@sha256:c4cbd9d9cb8dedbb055ac788dbd02635651b9b1cebac95b095b3217231aa87ad
    restart: unless-stopped
    command: ["--health", "/health", "posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: ${NIX_OBJECT_STORE_ACCESS_KEY:?set NIX_OBJECT_STORE_ACCESS_KEY}
      ROOT_SECRET_KEY: ${NIX_OBJECT_STORE_SECRET_KEY:?set NIX_OBJECT_STORE_SECRET_KEY}
    volumes:
      - nix-versity-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7070/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true

  nix-storage-init:
    image: amazon/aws-cli:2.36.31@sha256:f0dcd994da5c36ab09becf4259bba4c45ed4ecfd03d51c701912f4d8425b2d49
    profiles: [maintenance]
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${NIX_OBJECT_STORE_ACCESS_KEY:?set NIX_OBJECT_STORE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${NIX_OBJECT_STORE_SECRET_KEY:?set NIX_OBJECT_STORE_SECRET_KEY}
      AWS_DEFAULT_REGION: ${NIX_OBJECT_STORE_REGION:-us-east-1}
      NIX_BUCKET: ${NIX_OBJECT_STORE_BUCKET:?set NIX_OBJECT_STORE_BUCKET}
      # The sites bucket is created only when sites are enabled.
      NIX_SITES_BUCKET: ${NIX_SITES_DOMAIN:+${NIX_SITES_BUCKET:-nix-sites}}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'for bucket in "$$NIX_BUCKET" $$NIX_SITES_BUCKET; do aws --endpoint-url http://nix-versitygw:7070 s3api head-bucket --bucket "$$bucket" >/dev/null 2>&1 || aws --endpoint-url http://nix-versitygw:7070 s3api create-bucket --bucket "$$bucket"; done'
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  postgres:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${NIX_PG_SUPERUSER_PASSWORD:?set NIX_PG_SUPERUSER_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - nix-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        aliases:
          - postgres

  nix-api-init:
    image: busybox:1.37@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
    restart: "no"
    command: ["sh", "-c", "chown -R 1654:1654 /var/lib/nix/data-protection"]
    volumes:
      - nix-api-data-protection:/var/lib/nix/data-protection
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true

  nix-migrate:
    image: ${NIX_IMAGE_REGISTRY:-ghcr.io/sianachi/nix}/migrator:${NIX_IMAGE_TAG:?set NIX_IMAGE_TAG}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NIX_MIGRATOR_CONNECTION_STRING: ${NIX_MIGRATOR_CONNECTION_STRING:?set NIX_MIGRATOR_CONNECTION_STRING}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  nix-template-presets:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      nix-migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGDATABASE: nix
      PGUSER: nix_migrator
      PGPASSWORD: ${NIX_PG_MIGRATOR_PASSWORD:?set NIX_PG_MIGRATOR_PASSWORD}
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/seed/seed_template_presets.sql"]
    volumes:
      - ./seed/seed_template_presets.sql:/seed/seed_template_presets.sql:ro
    read_only: true
    mem_limit: 128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Opt-in identity bootstrap for a fresh install: deploy/compose/deploy.sh runs it after the
  # migrator when NIX_BOOTSTRAP_IDENTITY=true. See deploy/seed/bootstrap_identity.sql.
  nix-identity-bootstrap:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    restart: "no"
    profiles: ["bootstrap"]
    environment:
      PGHOST: postgres
      PGDATABASE: nix
      PGUSER: nix_migrator
      PGPASSWORD: ${NIX_PG_MIGRATOR_PASSWORD:?set NIX_PG_MIGRATOR_PASSWORD}
      NIX_BOOTSTRAP_TENANT_NAME: ${NIX_BOOTSTRAP_TENANT_NAME:-}
      NIX_BOOTSTRAP_TENANT_ID: ${NIX_BOOTSTRAP_TENANT_ID:-}
      NIX_BOOTSTRAP_OIDC_PROJECT_ID: ${NIX_BOOTSTRAP_OIDC_PROJECT_ID:-}
      NIX_OIDC_ISSUER: ${NIX_OIDC_ISSUER:?set NIX_OIDC_ISSUER}
      NIX_OIDC_CLIENT_ID: ${NIX_OIDC_CLIENT_ID:?set NIX_OIDC_CLIENT_ID}
    command:
      - sh
      - -c
      - >-
        exec psql -X -v ON_ERROR_STOP=1
        -v tenant_name="$$NIX_BOOTSTRAP_TENANT_NAME" -v tenant_id="$$NIX_BOOTSTRAP_TENANT_ID"
        -v oidc_issuer="$$NIX_OIDC_ISSUER" -v oidc_client_id="$$NIX_OIDC_CLIENT_ID"
        -v oidc_project_id="$$NIX_BOOTSTRAP_OIDC_PROJECT_ID"
        -f /seed/bootstrap_identity.sql
    volumes:
      - ./seed/bootstrap_identity.sql:/seed/bootstrap_identity.sql:ro
    read_only: true
    mem_limit: 128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  nix-api:
    image: ${NIX_IMAGE_REGISTRY:-ghcr.io/sianachi/nix}/api:${NIX_IMAGE_TAG:?set NIX_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nix-api-init:
        condition: service_completed_successfully
      nix-template-presets:
        condition: service_completed_successfully
    environment:
      # The release this container runs, shown in Settings > About.
      NIX_RELEASE_VERSION: ${NIX_RELEASE_VERSION:-}
      NIX_RELEASE_COMMIT: ${NIX_IMAGE_TAG}
      ASPNETCORE_ENVIRONMENT: Production
      Logging__Console__FormatterName: json
      ConnectionStrings__Nix: ${NIX_CORE_DATABASE_URL:?set NIX_CORE_DATABASE_URL}
      Nix__InternalSecret: ${NIX_INTERNAL_SECRET:?set NIX_INTERNAL_SECRET}
      Nix__Pets__WorkerUrl: http://nix-node:8302
      # Server-side pet tools (off | reads | all). Core's value is the kill switch: turn the
      # companion's on first, then this one.
      Nix__Pets__ServerTools: ${NIX_PETS_SERVER_TOOLS:-off}
      Nix__Collaboration__BaseUrl: http://nix-node:8100
      Nix__ObjectStorage__Endpoint: ${NIX_OBJECT_STORE_ENDPOINT:?set NIX_OBJECT_STORE_ENDPOINT}
      Nix__ObjectStorage__PublicOrigin: ${NIX_OBJECT_STORE_PUBLIC_ORIGIN:?set NIX_OBJECT_STORE_PUBLIC_ORIGIN}
      Nix__ObjectStorage__Region: ${NIX_OBJECT_STORE_REGION:-us-east-1}
      Nix__ObjectStorage__Bucket: ${NIX_OBJECT_STORE_BUCKET:?set NIX_OBJECT_STORE_BUCKET}
      Nix__ObjectStorage__AccessKey: ${NIX_OBJECT_STORE_ACCESS_KEY:?set NIX_OBJECT_STORE_ACCESS_KEY}
      Nix__ObjectStorage__SecretKey: ${NIX_OBJECT_STORE_SECRET_KEY:?set NIX_OBJECT_STORE_SECRET_KEY}
      Nix__PublicForms__SigningKey: ${NIX_PUBLIC_FORMS_SIGNING_KEY:?set NIX_PUBLIC_FORMS_SIGNING_KEY}
      # Public links for notes and files, signed with the key above. Off unless set to true.
      Nix__PublicLinks__Enabled: ${NIX_PUBLIC_LINKS_ENABLED:-false}
      Nix__ForwardedHeaders__KnownNetworks: 172.30.0.0/24
      Nix__ForwardedHeaders__ForwardLimit: "2"
      Nix__RateLimits__WritesPerMinute: "120"
      Nix__RateLimits__PublicFormSubmissionsPerMinute: "20"
      Nix__RateLimits__SuggestionsPerMinute: "60"
      Nix__Push__VapidPublicKey: ${NIX_PUSH_VAPID_PUBLIC_KEY:-}
      # Web Push is sent by Core's in-process notify worker; both halves of the key live here.
      Nix__Push__VapidPrivateKey: ${NIX_PUSH_VAPID_PRIVATE_KEY:-}
      Nix__Push__VapidSubject: ${NIX_PUSH_VAPID_SUBJECT:-}
      # Stable across container recreation, so a restart recognises the jobs it interrupted.
      Nix__Workers__InstanceId: nix-api
      Nix__GoWorkers__ExportEnabled: "true"
      Nix__GoWorkers__ImportEnabled: "true"
      Nix__Bff__Authority: ${NIX_OIDC_ISSUER:?set NIX_OIDC_ISSUER}
      Nix__Bff__ClientId: ${NIX_OIDC_CLIENT_ID:?set NIX_OIDC_CLIENT_ID}
      Nix__Bff__PublicOrigin: ${NIX_PUBLIC_ORIGIN:?set NIX_PUBLIC_ORIGIN}
      # The IdP's self-service page for password, passkey and MFA changes. Defaults to the
      # Zitadel console's own-account page; set NIX_OIDC_ACCOUNT_URL for any other provider.
      Nix__Bff__AccountPage: ${NIX_OIDC_ACCOUNT_URL:-${NIX_OIDC_ISSUER}/ui/console/users/me?id=security}
      # Also protects stored calendar refresh tokens (ADR-0052): every Core replica must share
      # this key ring. Back it up separately from the database, never alongside it.
      Nix__Bff__DataProtectionKeysPath: /var/lib/nix/data-protection
      # Two-way calendar sync. Empty leaves a provider unavailable; see compose.prod.env.example.
      Nix__Calendar__Google__ClientId: ${NIX_CALENDAR_GOOGLE_CLIENT_ID:-}
      Nix__Calendar__Google__ClientSecret: ${NIX_CALENDAR_GOOGLE_CLIENT_SECRET:-}
      Nix__Calendar__Microsoft__ClientId: ${NIX_CALENDAR_MICROSOFT_CLIENT_ID:-}
      Nix__Calendar__Microsoft__ClientSecret: ${NIX_CALENDAR_MICROSOFT_CLIENT_SECRET:-}
      Nix__Calendar__Microsoft__Tenant: ${NIX_CALENDAR_MICROSOFT_TENANT:-common}
      # Sites (ADR-0063). Off unless NIX_SITES_ENABLED=true and a domain are set; see
      # compose.prod.env.example.
      Nix__Sites__Enabled: ${NIX_SITES_ENABLED:-false}
      # The remote MCP endpoint the settings page shows people, empty when the mcp profile is off.
      Nix__Mcp__PublicUrl: ${NIX_MCP_PUBLIC_URL:-}
      Nix__Sites__Domain: ${NIX_SITES_DOMAIN:-}
      Nix__Sites__Bucket: ${NIX_SITES_BUCKET:-nix-sites}
      Nix__Sites__PublicScheme: https
      # A second deployment sharing the sites domain: default hostnames <slug><suffix>.<domain>, one
      # proxied record each in the sites zone (no wildcard), routed through the tunnel.
      Nix__Sites__DefaultHostLabelSuffix: ${NIX_SITES_DEFAULT_LABEL_SUFFIX:-}
      Nix__Sites__Cloudflare__ApiToken: ${NIX_SITES_CLOUDFLARE_API_TOKEN:-}
      Nix__Sites__Cloudflare__AccountId: ${NIX_SITES_CLOUDFLARE_ACCOUNT_ID:-}
      Nix__Sites__Cloudflare__TunnelId: ${NIX_SITES_CLOUDFLARE_TUNNEL_ID:-}
      Nix__Sites__Cloudflare__TunnelService: ${NIX_SITES_CLOUDFLARE_TUNNEL_SERVICE:-http://nix-sites-serve:8400}
      Nix__Sites__Cloudflare__DefaultHostnameZoneId: ${NIX_SITES_CLOUDFLARE_DEFAULT_HOSTNAME_ZONE_ID:-}
      Nix__AccessTokens__Issuer: ${NIX_CORE_TOKEN_ISSUER:?set NIX_CORE_TOKEN_ISSUER}
      Nix__AccessTokens__Audience: ${NIX_CORE_TOKEN_AUDIENCE:?set NIX_CORE_TOKEN_AUDIENCE}
      Nix__AccessTokens__KeyId: ${NIX_CORE_TOKEN_KEY_ID:?set NIX_CORE_TOKEN_KEY_ID}
      Nix__AccessTokens__SigningKeyPemFile: /run/secrets/core-access-token.pem
      Nix__AccessTokens__LifetimeMinutes: "10"
    volumes:
      - nix-api-data-protection:/var/lib/nix/data-protection
      - ${NIX_CORE_TOKEN_SIGNING_KEY_FILE:?set NIX_CORE_TOKEN_SIGNING_KEY_FILE}:/run/secrets/core-access-token.pem:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 768m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        aliases:
          - nix-api

  nix-collab-migrate:
    image: ${NIX_IMAGE_REGISTRY:-ghcr.io/sianachi/nix}/collab:${NIX_IMAGE_TAG:?set NIX_IMAGE_TAG}
    profiles: [maintenance]
    restart: "no"
    environment:
      NIX_COLLAB_MIGRATOR_CONNECTION_STRING: ${NIX_COLLAB_MIGRATOR_CONNECTION_STRING:-}
    command: ["pnpm", "--filter", "@nix/collab", "migrate-documents"]
    mem_limit: 768m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # One Node process runs collaboration (8100), the pet companion (8302) and, when sites are
  # enabled, the sites worker (8301). Each role keeps its own port and environment.
  nix-node:
    image: ${NIX_IMAGE_REGISTRY:-ghcr.io/sianachi/nix}/collab:${NIX_IMAGE_TAG:?set NIX_IMAGE_TAG}
    # The uid that owns the nix-companion-data volume from earlier releases.
    user: "65532:65532"
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      nix-api:
        condition: service_started
    environment:
      # The release this container runs, shown in Settings > About.
      NIX_RELEASE_VERSION: ${NIX_RELEASE_VERSION:-}
      NIX_RELEASE_COMMIT: ${NIX_IMAGE_TAG}
      NIX_NODE_ROLES: collab,companion${NIX_SITES_DOMAIN:+,sites-worker}
      TMPDIR: /tmp
      NIX_COLLAB_DATABASE_URL: ${NIX_COLLAB_DATABASE_URL:?set NIX_COLLAB_DATABASE_URL}
      NIX_COLLAB_CORE_BASE_URL: http://nix-api:8080
      NIX_COLLAB_INTERNAL_SECRET: ${NIX_INTERNAL_SECRET:?set NIX_INTERNAL_SECRET}
      NIX_COLLAB_OIDC_ISSUERS: ${NIX_OIDC_ISSUER:?set NIX_OIDC_ISSUER},${NIX_CORE_TOKEN_ISSUER:?set NIX_CORE_TOKEN_ISSUER}|http://nix-api:8080/public/v1/auth/jwks
      NIX_COLLAB_OIDC_AUDIENCE: ${NIX_OIDC_CLIENT_ID:?set NIX_OIDC_CLIENT_ID},${NIX_CORE_TOKEN_AUDIENCE:?set NIX_CORE_TOKEN_AUDIENCE}
      NIX_COLLAB_REAUTH_SECONDS: "60"
      NIX_COLLAB_MAX_RESIDENT_MB: "256"
      NIX_COLLAB_MAX_DOCS: "200"
      NIX_COLLAB_PORT: "8100"
      # The companion holds no database or storage credential.
      NIX_COMPANION_DATA_DIR: /var/lib/nix-companion
      NIX_COMPANION_INTERNAL_SECRET: ${NIX_INTERNAL_SECRET:?set NIX_INTERNAL_SECRET}
      NIX_COMPANION_API_URL: http://nix-api:8080
      NIX_COMPANION_ADDRESS: ":8302"
      NIX_COMPANION_SERVER_TOOLS: ${NIX_COMPANION_SERVER_TOOLS:-off}
      NIX_COMPANION_COLLAB_URL: http://nix-node:8100
      # Sites worker (only started when NIX_SITES_DOMAIN is set).
      NIX_SITES_API_URL: http://nix-api:8080
      NIX_SITES_COLLAB_URL: http://nix-node:8100
      NIX_SITES_INTERNAL_SECRET: ${NIX_INTERNAL_SECRET:?set NIX_INTERNAL_SECRET}
      NIX_SITES_OBJECT_ORIGINS: ${NIX_OBJECT_STORE_ENDPOINT:?set NIX_OBJECT_STORE_ENDPOINT},${NIX_OBJECT_STORE_PUBLIC_ORIGIN:?set NIX_OBJECT_STORE_PUBLIC_ORIGIN}
      NIX_SITES_WORKER_ADDRESS: ":8301"
      NIX_SITES_CONCURRENCY: "1"
    volumes:
      - nix-companion-data:/var/lib/nix-companion
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "Promise.all(['8100','8302'${NIX_SITES_DOMAIN:+,'8301'}].map(p=>fetch('http://127.0.0.1:'+p+(p==='8301'?'/readyz':'/healthz')).then(r=>{if(!r.ok)throw 0}))).then(()=>process.exit(0),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 90s
    mem_limit: 1280m
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        aliases:
          - nix-node

  # Anonymous: no Core secret, no database, no broker. Reached only through nix-web's sites host.
  nix-sites-serve:
    image: ${NIX_IMAGE_REGISTRY:-ghcr.io/sianachi/nix}/sites:${NIX_IMAGE_TAG:?set NIX_IMAGE_TAG}
    profiles: [sites]
    restart: unless-stopped
    command: ["node", "--experimental-strip-types", "src/serve/index.ts"]
    depends_on:
      nix-versitygw:
        condition: service_healthy
    environment:
      # The release this container runs, shown in Settings > About.
      NIX_RELEASE_VERSION: ${NIX_RELEASE_VERSION:-}
      NIX_RELEASE_COMMIT: ${NIX_IMAGE_TAG}
      NIX_SITES_SERVE_ADDRESS: ":8400"
      NIX_SITES_ALLOWED_SUFFIX: ${NIX_SITES_DOMAIN:-}
      NIX_SITES_DEFAULT_LABEL_SUFFIX: ${NIX_SITES_DEFAULT_LABEL_SUFFIX:-}
      NIX_SITES_S3_ENDPOINT: http://nix-versitygw:7070
      NIX_SITES_S3_REGION: ${NIX_OBJECT_STORE_REGION:-us-east-1}
      NIX_SITES_S3_BUCKET: ${NIX_SITES_BUCKET:-nix-sites}
      NIX_SITES_S3_ACCESS_KEY: ${NIX_SITES_READ_ACCESS_KEY:-}
      NIX_SITES_S3_SECRET_KEY: ${NIX_SITES_READ_SECRET_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8400/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
    mem_limit: 256m
    cpus: 1
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        aliases:
          - nix-sites-serve

  # Remote MCP (requirement 9): the nixctl tool contract over Streamable HTTP at /mcp. Off unless
  # COMPOSE_PROFILES includes mcp. Every request carries its own personal access token; the process
  # holds no credential of its own and Core authorizes each call.
  nix-mcp:
    image: ${NIX_IMAGE_REGISTRY:-ghcr.io/sianachi/nix}/release-tools:${NIX_IMAGE_TAG:?set NIX_IMAGE_TAG}
    profiles: [mcp]
    restart: unless-stopped
    command: ["nixctl", "mcp", "--listen", "0.0.0.0:8500"]
    depends_on:
      nix-api:
        condition: service_started
    environment:
      # The release this container runs, shown in Settings > About.
      NIX_RELEASE_VERSION: ${NIX_RELEASE_VERSION:-}
      NIX_RELEASE_COMMIT: ${NIX_IMAGE_TAG}
      NIX_API_URL: http://nix-api:8080
      NIX_COLLAB_URL: http://nix-node:8100
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8500/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  nix-web:
    image: ${NIX_IMAGE_REGISTRY:-ghcr.io/sianachi/nix}/web:${NIX_WEB_IMAGE_TAG:?set NIX_WEB_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      nix-api:
        condition: service_started
      nix-node:
        condition: service_healthy
    environment:
      # The release this container runs, shown in Settings > About.
      NIX_RELEASE_VERSION: ${NIX_RELEASE_VERSION:-}
      NIX_RELEASE_COMMIT: ${NIX_WEB_IMAGE_TAG}
      NIX_OBJECT_STORE_PUBLIC_ORIGIN: ${NIX_OBJECT_STORE_PUBLIC_ORIGIN:?set NIX_OBJECT_STORE_PUBLIC_ORIGIN}
      NIX_OBJECT_STORE_BUCKET: ${NIX_OBJECT_STORE_BUCKET:?set NIX_OBJECT_STORE_BUCKET}
      # Unset keeps the sites host block on a name that never resolves.
      NIX_SITES_DOMAIN: ${NIX_SITES_DOMAIN:-sites.invalid}
      # Where /mcp is proxied; unset points at a name that never resolves so the route fails closed.
      NIX_MCP_UPSTREAM: ${NIX_MCP_UPSTREAM:-mcp.invalid:8500}
      NIX_SITES_DEFAULT_LABEL_SUFFIX: ${NIX_SITES_DEFAULT_LABEL_SUFFIX:-}
      # The placeholder Caddy forwards as the client address (Caddyfile.prod).
      NIX_CLIENT_IP: "{http.request.header.CF-Connecting-IP}"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - nix-caddy-data:/data
      - nix-caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        aliases:
          # Keeps the existing remotely-managed Cloudflare route valid.
          - nix-web.nix.svc.cluster.local

  cloudflared:
    image: cloudflare/cloudflared:latest@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      nix-web:
        condition: service_healthy
    mem_limit: 256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  default:
    name: nix
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  nix-companion-data:
    name: nix-companion-data
  nix-postgres-data:
